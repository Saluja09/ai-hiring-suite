name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

  secret-guard:
    name: Secret-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real Hunar API key is committed
        run: |
          # A real Hunar key looks like: hunar_va_live_sk_<long random body>.
          # The prefix alone appears in docs/ (plan notes discussing this very
          # guard), so we require the prefix to be followed by a long token
          # body AND exclude docs/ from the scan — that combination only
          # matches an actual leaked key, not prose mentioning the prefix.
          if git grep -nI -E 'hunar_va_live_sk_[A-Za-z0-9_-]{20,}' -- . ':(exclude)docs/**'; then
            echo "::error::Found what looks like a real Hunar API key committed to the repo. Remove it, rotate the key, and force-push a fix before merging."
            exit 1
          else
            echo "No leaked Hunar API keys found."
          fi
